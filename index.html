<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#F8F9FC" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent is the only full-bleed mechanism (backdrops must dim
         the status bar). The 2026-07 "dead band" was NOT this mode: iOS grants
         the full-screen coordinate space only while the document is at least
         screen-height tall, and the shell was then sized from dvh, which
         standalone misreports small at cold start — so the app locked itself
         into the reduced space. The shell now sizes standalone from lvh (see
         index.css), verified on iOS 18.7 device + 26.3 simulator across
         keyboard/relaunch/lock. Android ignores this tag entirely. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZAPPI Wallet" />
    <!-- Full-bleed gate. External file on purpose: the production CSP only
         allows same-origin scripts, so an inline version is silently blocked
         in prod while working in dev. Must run before first paint. -->
    <script src="/standalone-gate.js"></script>

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Pretendard (primary) + Montserrat (display/amounts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="/pretendard.min.css" />

    <title>ZAPPI Wallet</title>
  </head>
  <body>
    <div id="root">
      <!-- Inline fallback UI (shown before JS loads or on offline) -->
      <style>
        .pwa-loading {
          min-height: 100vh;
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #F8F9FC;
          color: #1D1D1F;
          font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .pwa-loading-content { text-align: center; }
        .pwa-loading-title {
          font-size: 2rem;
          font-weight: bold;
          letter-spacing: -0.05em;
          color: #515AC0;
        }
        .pwa-loading-subtitle {
          font-size: 0.875rem;
          opacity: 0.6;
          margin-top: 0.5rem;
        }
      </style>
      <div class="pwa-loading">
        <div class="pwa-loading-content">
          <div class="pwa-loading-title">ZAPPI</div>
          <div class="pwa-loading-subtitle">로딩 중...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function() {
        if (document.querySelector('.pwa-loading')) {
          var sub = document.querySelector('.pwa-loading-subtitle');
          if (sub) {
            sub.textContent = navigator.onLine
              ? 'Loading failed. Please refresh.'
              : 'Please connect to the internet and reopen the app.';
          }
        }
      }, 8000);
    </script>
  </body>
</html>

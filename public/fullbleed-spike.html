<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FB Spike" />
  <meta name="theme-color" content="#F8F9FC" />
  <title>Full-bleed Spike v5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background-color: #FFD34D; } /* canvas detector: yellow = uncovered */
    body {
      background-color: #F8F9FC;
      min-height: 100vh;
      min-height: 100lvh;
      color: #1D1D1F;
      font-family: -apple-system, system-ui, sans-serif;
      overscroll-behavior: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 120px);
    }
    main { padding: 12px 16px; }
    h1 { font-size: 17px; margin-bottom: 4px; }
    .hint { font-size: 12px; color: #6F7076; margin-bottom: 12px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    td { padding: 3px 4px; border-bottom: 1px solid #E5E7F0; }
    td:first-child { color: #6F7076; }
    td:last-child { text-align: right; font-weight: 600; }
    .warn td:last-child { color: #FF3B30; }
    .row { display: flex; gap: 8px; margin: 12px 0; }
    button {
      flex: 1; padding: 12px 8px; font-size: 13px; font-weight: 600;
      border: none; border-radius: 10px; background: #515AC0; color: #fff;
    }
    #log {
      font-size: 10px; font-family: ui-monospace, monospace; white-space: pre;
      overflow: auto; background: #fff; border: 1px solid #E5E7F0;
      border-radius: 10px; padding: 8px; max-height: 180px; line-height: 1.6;
    }
    /* RED: fixed inset-0 + lvh override — the exact overlay construction the
       wallet ships. Its bottom edge must touch the physical bottom. */
    #overlayProbe {
      position: fixed; inset: 0; top: 0; bottom: auto;
      height: 100vh; height: 100lvh;
      pointer-events: none; z-index: 5;
      border-left: 6px solid #FF3B30; border-right: 6px solid #FF3B30;
    }
    #overlayProbe::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0;
      height: 4px; background: #FF3B30;
    }
    /* GREEN: plain fixed bottom:0 bar with env padding (tab-dock analog) */
    #tabbar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: rgba(52, 199, 89, 0.92); color: #fff; text-align: center;
      font-size: 12px; font-weight: 600; padding-top: 8px;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); z-index: 20;
    }
    #dim {
      position: fixed; inset: 0; top: 0; bottom: auto;
      height: 100vh; height: 100lvh;
      background: rgba(0,0,0,0.5); z-index: 50; display: none;
    }
    #dim.on { display: block; }
    .probe { position: absolute; visibility: hidden; pointer-events: none; left: -9999px; width: 1px; }
    #pTop    { height: env(safe-area-inset-top, 0px); }
    #pBottom { height: env(safe-area-inset-bottom, 0px); }
    #pVh  { height: 100vh; }
    #pDvh { height: 100dvh; }
    #pSvh { height: 100svh; }
    #pLvh { height: 100lvh; }
  </style>
</head>
<body>
  <main>
    <h1>풀블리드 스파이크 v5</h1>
    <p class="hint">
      확인 A: <b>빨간 가로선</b>이 화면 물리 바닥(인디케이터 뒤)에 닿는가? — 지갑 백드롭과 동일 구조<br/>
      확인 B: <b>노란색</b>이 보이면 그 높이를 기록<br/>
      확인 C: "배경 어둡게" → 바닥까지 전부 어두운가?<br/>
      이 화면을 스크린샷해서 공유해주세요. iOS 버전도 함께요.
    </p>
    <table id="metrics"></table>
    <div class="row">
      <button id="dimBtn">배경 어둡게</button>
      <button id="copyBtn">로그 복사</button>
    </div>
    <div id="log"></div>
  </main>
  <div id="overlayProbe"></div>
  <div id="tabbar">초록: fixed bottom 0 + env 패딩</div>
  <div id="dim" onclick="this.classList.remove('on')"></div>

  <div class="probe" id="pTop"></div>
  <div class="probe" id="pBottom"></div>
  <div class="probe" id="pVh"></div>
  <div class="probe" id="pDvh"></div>
  <div class="probe" id="pSvh"></div>
  <div class="probe" id="pLvh"></div>

  <script>
    var LS_KEY = 'fb-spike-log-v5';
    var lastSnap = '';
    function h(id) { return document.getElementById(id).offsetHeight; }
    function snapshot() {
      var vv = window.visualViewport;
      var ov = document.getElementById('overlayProbe').getBoundingClientRect();
      var tab = document.getElementById('tabbar').getBoundingClientRect();
      return {
        t: new Date().toISOString().slice(11, 19),
        ua: (navigator.userAgent.match(/OS (\d+_\d+(_\d+)?)/) || [,'?'])[1],
        standalone: navigator.standalone === true ? 1 : 0,
        scr: window.screen.height,
        inH: window.innerHeight,
        ch: document.documentElement.clientHeight,
        vvH: vv ? Math.round(vv.height) : -1,
        envT: h('pTop'), envB: h('pBottom'),
        vh: h('pVh'), dvh: h('pDvh'), svh: h('pSvh'), lvh: h('pLvh'),
        ovBot: Math.round(ov.bottom), tabBot: Math.round(tab.bottom),
      };
    }
    function fmt(s) {
      return s.t + ' scr:' + s.scr + ' in:' + s.inH + ' ch:' + s.ch + ' vv:' + s.vvH +
        ' env:' + s.envT + '/' + s.envB +
        ' vh:' + s.vh + ' dvh:' + s.dvh + ' svh:' + s.svh + ' lvh:' + s.lvh +
        ' ov:' + s.ovBot + ' tab:' + s.tabBot;
    }
    function loadLog() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; } }
    function record(trigger) {
      var s = snapshot();
      var line = fmt(s) + ' <' + trigger + '>';
      var key = line.replace(/^\S+ /, '').replace(/ <.*$/, '');
      if (key === lastSnap && trigger === 'poll') return;
      lastSnap = key;
      var lines = loadLog(); lines.push(line);
      try { localStorage.setItem(LS_KEY, JSON.stringify(lines.slice(-150))); } catch (e) {}
      render(s, lines);
    }
    function render(s, lines) {
      var rows = [
        ['iOS(UA) / standalone', (s.ua || '?').replace(/_/g, '.') + ' / ' + (s.standalone ? 'YES' : 'NO — 홈 화면 추가 후 아이콘으로 실행'), !s.standalone],
        ['screen / innerHeight', s.scr + ' / ' + s.inH, s.standalone && s.inH !== s.scr],
        ['env top / bottom', s.envT + ' / ' + s.envB, s.standalone && s.envT === 0],
        ['vh / dvh / svh / lvh', s.vh + ' / ' + s.dvh + ' / ' + s.svh + ' / ' + s.lvh, false],
        ['빨간선 바닥 (=' + s.scr + '이면 성공)', s.ovBot, s.standalone && s.ovBot !== s.scr],
        ['초록 바닥 (=' + s.scr + '이면 성공)', s.tabBot, s.standalone && s.tabBot !== s.scr],
      ];
      var html = '';
      for (var i = 0; i < rows.length; i++) {
        html += '<tr' + (rows[i][2] ? ' class="warn"' : '') + '><td>' + rows[i][0] + '</td><td>' + rows[i][1] + '</td></tr>';
      }
      document.getElementById('metrics').innerHTML = html;
      document.getElementById('log').textContent = lines.slice(-30).reverse().join('\n');
    }
    ['pageshow', 'resize', 'orientationchange', 'focusout'].forEach(function (ev) {
      window.addEventListener(ev, function () { record(ev); setTimeout(function () { record(ev + '+400ms'); }, 400); });
    });
    document.addEventListener('visibilitychange', function () { record('vis:' + document.visibilityState); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { record('vv-resize'); });
    setInterval(function () { record('poll'); }, 1000);
    document.getElementById('dimBtn').addEventListener('click', function () {
      document.getElementById('dim').classList.add('on');
    });
    document.getElementById('copyBtn').addEventListener('click', function () {
      if (navigator.clipboard) navigator.clipboard.writeText(loadLog().join('\n'));
    });
    record('boot');
  </script>
</body>
</html>

name: Deploy nightly

# Replaces Jenkinsfile.nightly (docker image → nginx on :3022).
# Deploys ANY ref (commit SHA, branch, tag) to wallet-nightly.zappi.space, which
# is production branch `nightly` of the Pages project zappi-wallet-nightly — so
# whatever this run deploys replaces what is live.
#
# Every deployment also keeps a permanent per-commit URL
# (https://<hash>.zappi-wallet-nightly.pages.dev), so one commit can be tested
# without touching staging. Roll back from the Pages dashboard.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to deploy'
        required: true
        default: main
      npubcash_url:
        description: 'npubcash API base URL (empty = https://zappi.space)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-nightly
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: nightly
      url: https://wallet-nightly.zappi.space
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run test:run

      - run: bun run build
        env:
          VITE_ZAPPI_CHANNEL: nightly
          VITE_NPUBCASH_URL: ${{ inputs.npubcash_url || 'https://zappi.space' }}

      - run: bun run check:seed-leak

      - run: |
          test -f dist/_headers
          test -f dist/_redirects
          grep -q 'Content-Security-Policy' dist/_headers

      - run: >-
          bunx wrangler@4 pages deploy dist
          --project-name zappi-wallet-nightly
          --branch nightly
          --commit-hash "$(git rev-parse HEAD)"
          --commit-message "nightly: ${{ inputs.ref }}"
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

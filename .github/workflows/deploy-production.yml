name: Deploy production

# Prod is never automatic. A human bumps the version, tags it, and then runs this
# workflow by hand with that tag. A tag push only records the release; it does not
# deploy. Only deploy-production does, and the version must match package.json, so
# what ships is always exactly vX.Y.Z.
#
#   git tag -a v0.4.5 -m v0.4.5 && git push origin v0.4.5
#   gh workflow run deploy-production.yml -f ref=v0.4.5
#
# Roll back to a version that already exists:
#   gh workflow run deploy-production.yml -f ref=v0.4.3
#
# Known gap vs nginx: server-assets/bot.html (crawler OG page) is not in dist/.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version tag to deploy (must match package.json)'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wallet.zappi.space
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The gate: deploy = a version tag whose commit says the same thing. Also
      # rejects a branch name passed by mistake.
      - name: Verify version
        run: |
          ref="${{ inputs.ref }}"
          pkg="$(node -p "require('./package.json').version")"
          case "$ref" in
            v[0-9]*) ;;
            *) echo "::error::ref must be a version tag like v0.4.5 (got '$ref')"; exit 1 ;;
          esac
          test "${ref#v}" = "$pkg" || {
            echo "::error::$ref != package.json $pkg at $(git rev-parse --short HEAD)"
            exit 1
          }
          echo "Deploying $ref ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - run: bun run test:run

      - run: bun run build
        env:
          VITE_ZAPPI_CHANNEL: main
          VITE_NPUBCASH_URL: https://zappi.space

      - run: bun run check:seed-leak

      - run: |
          test -f dist/_headers
          test -f dist/_redirects
          grep -q 'Content-Security-Policy' dist/_headers

      - run: >-
          bunx wrangler@4 pages deploy dist
          --project-name zappi-wallet
          --branch production
          --commit-hash "$(git rev-parse HEAD)"
          --commit-message "${{ inputs.ref }}"
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

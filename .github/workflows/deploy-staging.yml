name: Deploy staging

# Replaces the Jenkinsfile "Deploy Staging" stage (docker image → nginx on :3021).
# Everything main lands here: wallet-staging.zappi.space = Cloudflare Pages
# project zappi-wallet-staging, production branch `main`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://wallet-staging.zappi.space
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # CI runs lint separately; these are the gates that must block a deploy.
      - run: bun run test:run

      - run: bun run build
        env:
          VITE_ZAPPI_CHANNEL: staging
          VITE_NPUBCASH_URL: https://zappi.space

      - run: bun run check:seed-leak

      # Pages reads these from the output root. Missing either one deploys a
      # site with no CSP or no SPA fallback — both silent, so fail loudly here.
      - run: |
          test -f dist/_headers
          test -f dist/_redirects
          grep -q 'Content-Security-Policy' dist/_headers

      - run: >-
          bunx wrangler@4 pages deploy dist
          --project-name zappi-wallet-staging
          --branch main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
